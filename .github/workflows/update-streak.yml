name: Update Streak Stats

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Fetch contribution stats from GitHub GraphQL
        id: stats
        run: |
          set -e
          RESPONSE=$(curl -sf -X POST https://api.github.com/graphql \
            -H "Authorization: bearer ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-raw '{"query":"{ user(login: \"tanshuu8\") { contributionsCollection { contributionCalendar { totalContributions } } } }"}')
          echo "Response: $RESPONSE"
          TOTAL=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['user']['contributionsCollection']['contributionCalendar']['totalContributions'])")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Fetched: $TOTAL contributions"

      - name: Generate streak-stats.svg
        run: |
          TOTAL="${{ steps.stats.outputs.total }}"
          sed -i "s|>\s*[0-9]*\s*</text>|>${TOTAL}</text>|" streak-stats.svg
          echo "SVG updated with $TOTAL"

      - name: Commit and push updated SVG
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add streak-stats.svg
          git diff --staged --quiet || git commit -m "chore: sync streak stats to ${TOTAL} contributions [skip ci]"
          git push
        env:
          TOTAL: ${{ steps.stats.outputs.total }}
